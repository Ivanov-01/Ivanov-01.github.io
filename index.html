
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vylox Store | Acceso</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f3faff;
      color: #17364d;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 430px;
      padding: 38px 28px;
      background: white;
      border: 1px solid #d8eaf5;
      border-radius: 18px;
      text-align: center;
    }
    h1 { color: #007bff; margin-bottom: 12px; }
    p { line-height: 1.6; color: #587084; }
    .estado {
      padding: 14px;
      background: #eef8ff;
      border-radius: 10px;
      margin-top: 22px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Vylox Store</h1>
    <p>Bienvenido a nuestra tienda de productos tecnológicos.</p>
    <div class="estado">
      Próximamente: acceso al sistema desde cualquier dispositivo.
    </div>
  </main>
</body>
</html>
